version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: voice_translator_db
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Pass123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Pass123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Pass123!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    image: voice_translator_api:latest
    build:
      context: ./core_api
      dockerfile: Dockerfile
    container_name: voice_translator_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=VoiceTranslatorDb;User Id=sa;Password=YourStrong@Pass123!;TrustServerCertificate=True;
      - Database__InitializeOnStartup=true
    ports:
      - "7068:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web_app:
    image: voice_translator_app:latest
    build:
      context: ./flutter_apps/voice_translator_app
      dockerfile: Dockerfile
    container_name: voice_translator_app
    ports:
      - "8082:80"
    depends_on:
      - api

volumes:
  mssql-data:
